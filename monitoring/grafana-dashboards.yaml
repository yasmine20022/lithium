apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: deploy-proj-796a9c963e46
  labels:
    app: grafana
data:
  lithium-dashboard.json: |
    {
      "id": null,
      "uid": "lithium-monitoring",
      "version": 1,
      "annotations": {
        "list": []
      },
      "editable": true,
      "schemaVersion": 39,
      "title": "lithium \u2014 python monitoring",
      "tags": [
        "devops-autopilot",
        "python"
      ],
      "timezone": "browser",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "refresh": "10s",
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "CPU Usage (cores)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"deploy-proj-796a9c963e46\",pod=~\"lithium-.*\"}[5m]))",
              "legendFormat": "CPU Usage (cores)"
            }
          ]
        },
        {
          "id": 2,
          "title": "Memory Usage MB",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"deploy-proj-796a9c963e46\",pod=~\"lithium-.*\"}) / 1024 / 1024",
              "legendFormat": "Memory Usage MB"
            }
          ]
        },
        {
          "id": 3,
          "title": "Network In KB/s",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_network_receive_bytes_total{id=\"/\",interface=\"eth0\"}[5m])) / 1024",
              "legendFormat": "Network In KB/s"
            }
          ]
        },
        {
          "id": 4,
          "title": "Network Out KB/s",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_network_transmit_bytes_total{id=\"/\",interface=\"eth0\"}[5m])) / 1024",
              "legendFormat": "Network Out KB/s"
            }
          ]
        },
        {
          "id": 5,
          "title": "Filesystem Usage MB",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(container_fs_usage_bytes) / 1024 / 1024",
              "legendFormat": "Filesystem Usage MB"
            }
          ]
        },
        {
          "id": 6,
          "title": "App Target Up",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{job=\"lithium\"}",
              "legendFormat": "App Target Up"
            }
          ]
        }
      ]
    }
